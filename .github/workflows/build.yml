name: SailfishOS build

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

env:
  RELEASE: 5.2.0.15

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: ['armv7hl', 'aarch64', 'i486']

    steps:
    - uses: actions/checkout@v5

    # Let's produce a Harbour-compatible RPM.
    - name: Configure Harbour-compatible build
      run: sed -i '1i %define harbour 1' rpm/harbour-periscope.spec

    - name: Build ${{ matrix.arch }}
      uses: coderus/github-sfos-build@sfos5
      with:
        release: ${{ env.RELEASE }}
        arch: ${{ matrix.arch }}

    - name: Upload build result
      uses: actions/upload-artifact@v5
      with:
        name: rpms-${{ matrix.arch }}
        path: RPMS
